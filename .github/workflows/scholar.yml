name: Update Scholar metrics

on:
  schedule:
    # Every Monday at 06:00 UTC. Google Scholar changes slowly, so weekly is plenty.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Scholar metrics
        env:
          # Optional: add a free SerpApi key as a repo secret for reliable
          # results. Without it the script scrapes directly and degrades
          # gracefully (keeps the last-known values) when Scholar blocks it.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/fetch-scholar.mjs

      - name: Commit if metrics changed
        run: |
          if [[ -n "$(git status --porcelain src/data/scholar.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/scholar.json
            git commit -m "chore: update Google Scholar metrics"
            git push
          else
            echo "No change in Scholar metrics."
          fi
